name: Herobrine
version: 1.0.0
main: dev.herobrine.HerobrinePlugin
api-version: "1.21"
depend: [Citizens]
description: Herobrine haunts your server.
commands:
  herobrine:
    description: Control Herobrine
    usage: /herobrine <summon|stare|walk|jumpscare|sign|fakejoin|fakeleave|clear|reload>
    permission: herobrine.admin
permissions:
  herobrine.admin:
    default: op
